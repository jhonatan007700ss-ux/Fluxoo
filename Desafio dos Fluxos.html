<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Desafio dos Fluxos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: console de treinamento. Barra superior azul Vero; palco claro; a "trilha" (linha de metrô)
   mostra o caminho do fluxo, com nós coloridos por desempenho. Sem tema escuro: o briefing pede fundo claro. */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#eceff8; --ink:#171d3b; --ink-2:#444d72; --muted:#646d8e; --line:#dce1ef; --line-2:#c9d0e4;
  --brand:#29377f; --brand-2:#1f2a69; --brand-deep:#141a40; --accent:#f3953f; --accent-ink:#4d2704;
  --ok:#157347; --ok-bg:#e3f3ea; --bad:#b3261e; --bad-bg:#fdebe9; --warn:#7a4a00; --warn-bg:#fff3de; --info:#25397e; --info-bg:#e8edfb;
  --gold:#f2b632; --silver:#c1c8da; --bronze:#d98c50;
  --c-adapter:#1d5fc4; --c-ng:#6b3fb5; --c-simetra:#0a7184; --c-geral:#55607a;
  --t-adapter:#e5eefb; --t-ng:#eee8fa; --t-simetra:#dff1f4; --t-geral:#eceff4;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(23,29,59,.06),0 6px 18px rgba(23,29,59,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
small{display:block;color:var(--muted);font-size:.78rem;font-weight:400;margin-top:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
main.wrap{padding-block:28px 40px}
.muted{color:var(--muted)}
.eyebrow{font:700 .74rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:.8rem}

/* crm */
.crm-adapter{--c:var(--c-adapter);--t:var(--t-adapter)}
.crm-ng{--c:var(--c-ng);--t:var(--t-ng)}
.crm-simetra{--c:var(--c-simetra);--t:var(--t-simetra)}
.crm-geral{--c:var(--c-geral);--t:var(--t-geral)}
.crm{display:inline-flex;align-items:center;gap:7px;font:600 .8rem/1 var(--font-body);color:var(--c);background:var(--t);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-radius:999px;padding:4px 10px 4px 4px;white-space:nowrap}
.crm b{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;border-radius:999px;background:var(--c);color:#fff;font:700 .68rem/1 var(--font-mono);letter-spacing:.02em}
.crm-lg{font-size:.95rem;padding:6px 14px 6px 6px}.crm-lg b{height:28px;min-width:32px;font-size:.78rem}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;border-bottom:3px solid var(--accent)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:4px 2px;font:800 .95rem/1 var(--font-display);letter-spacing:.07em}
.mark{width:32px;height:32px;color:#fff;flex:none}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-user{background:rgba(255,255,255,.14)}.chip-score{background:var(--accent);color:var(--accent-ink)}.chip-score b{font-family:var(--font-mono)}
.topbar.adm{background:var(--brand-deep);border-bottom-color:#8a93c4;background-image:repeating-linear-gradient(135deg,rgba(243,149,63,.0) 0 14px,rgba(243,149,63,.10) 14px 28px)}
.adm-tag{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);font:800 .7rem/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:6px 9px}
.adm-tag svg{width:14px;height:14px}

/* botões */
svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:.95rem;cursor:pointer;transition:background .15s,transform .05s,border-color .15s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}.btn.primary:hover:not(:disabled){background:var(--brand-2)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}.btn.accent:hover:not(:disabled){background:#e9871f}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--brand)}.btn.ghost:hover:not(:disabled){border-color:var(--brand)}
.btn.ghost-d{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}.btn.ghost-d:hover{background:rgba(255,255,255,.2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.lg{min-height:52px;padding:12px 24px;font-size:1.02rem}
.link{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600;font-size:inherit}

/* alertas */
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;margin-top:14px}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--info-bg);color:var(--info)}
.erro{color:var(--bad);font-weight:600;font-size:.88rem;min-height:1.3em;margin-top:6px}
.hint{color:var(--muted);font-size:.88rem}.hint.inline{margin-left:4px}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:24px;align-items:center;padding-block:14px 8px}
.hero h1{font-weight:800;font-size:clamp(2.3rem,6.4vw,4.1rem);letter-spacing:-.025em;color:var(--brand);margin-block:14px 12px;text-transform:uppercase}
.lead{font:600 1.35rem/1.2 var(--font-display);color:var(--ink-2)}
.nome-form{margin-top:26px;max-width:560px}
.nome-form label,.gate label,.f label,.modal label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--ink-2)}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line-2);border-radius:12px;background:#fff;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(41,55,127,.18)}
input[aria-invalid=true]{border-color:var(--bad)}
.nome-row{display:flex;gap:10px;flex-wrap:wrap}.nome-row input{flex:1 1 220px;width:auto}
.resume{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px;max-width:560px;background:var(--info-bg);border:1px solid #c5d0f2;border-radius:var(--r);padding:14px 16px}
.resume b{display:block}.resume span{font-size:.9rem;color:var(--ink-2)}.resume-act{display:flex;gap:8px}
.hero-art{max-width:320px;justify-self:end;width:100%}.hero-art svg{width:100%;height:auto;overflow:visible}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.rule-k{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--brand);font:800 1rem/1 var(--font-display);margin-bottom:10px}
.rule-k svg{width:20px;height:20px}
.rule h3{font-size:1.05rem;margin-bottom:6px}.rule p{color:var(--ink-2);font-size:.92rem}
.pts-row{display:flex;gap:10px;align-items:baseline}.pts-row b{font:700 1.05rem var(--font-mono);color:var(--brand);min-width:2.4ch;text-align:right}
.foot{display:flex;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:18px 28px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

/* seleção */
.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.overview h2{font-size:1.9rem;margin-block:8px 6px;overflow-wrap:anywhere}.ov-sub{color:var(--ink-2);font-size:.95rem}
.ov-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:.92rem}.ov-row b{font-family:var(--font-display)}.ov-row.sm{margin:8px 0 0;color:var(--muted);font-size:.85rem}.ov-row.sm b{color:var(--brand);font-family:var(--font-mono)}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--brand));transition:width .35s ease;min-width:0}
.bar.navy i{background:var(--brand)}.bar.crmc i{background:var(--c)}
.tabs{display:flex;gap:8px;margin-block:22px 14px;overflow-x:auto;padding-bottom:4px}
.tab{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 9px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;white-space:nowrap;color:var(--ink-2)}
.tab b{display:inline-grid;place-items:center;min-width:30px;height:26px;border-radius:8px;background:var(--t);color:var(--c);font:700 .72rem var(--font-mono)}
.tab-n{font:600 .78rem var(--font-mono);color:var(--muted)}
.tab.on{border-color:var(--c);color:var(--ink);background:var(--t)}.tab.on b{background:var(--c);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.fc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.fcard h3{font-size:1.1rem;margin-top:6px}.fc-sub{color:var(--ink-2);font-size:.92rem}.fc-meta{color:var(--muted);font-size:.82rem;margin-bottom:8px}
.fcard .btn{margin-top:auto}
.status{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--ink-2)}
.status svg{width:14px;height:14px}
.status.s-concluido{background:var(--ok-bg);color:var(--ok)}.status.s-em_andamento{background:var(--warn-bg);color:var(--warn)}
.end-bar{display:flex;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;align-items:center;margin-top:24px;padding:16px 18px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r)}
.end-bar b{display:block}.end-bar span{color:var(--muted);font-size:.88rem}.end-act{display:flex;gap:8px;flex-wrap:wrap}

/* desafio */
.play-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ph-l{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;min-width:0}.ph-l h2{font-size:1.35rem}.ph-l p{color:var(--ink-2);font-size:.92rem;margin-top:3px}.ph-l>div{min-width:0;flex:1 1 200px}
.ph-prog{display:grid;gap:12px}.pg-row{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}.pg-row b{color:var(--ink);font-family:var(--font-mono)}
.play-grid{display:grid;grid-template-columns:72px minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.rail{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 0 8px;text-align:center}
.trail{list-style:none;margin:0;padding:0}
.nd{position:relative;height:40px;display:flex;justify-content:center;align-items:center}
.nd::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--line-2)}
.nd:first-child::before{top:50%}.nd:last-child::before{bottom:50%}
.nd span{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line-2);color:var(--muted);font:700 .74rem var(--font-mono)}
.nd.ouro span{background:var(--gold);border-color:var(--gold);color:#4a3200}.nd.prata span{background:var(--silver);border-color:var(--silver);color:#2c3552}.nd.bronze span{background:var(--bronze);border-color:var(--bronze);color:#3d1f06}
.nd.falha span{background:#fff;border-color:var(--bad);color:var(--bad);font-size:1rem}
.nd.atual span{background:#fff;border:3px solid var(--accent);color:var(--ink);box-shadow:0 0 0 4px rgba(243,149,63,.25);width:32px;height:32px}
.legend{font:600 .66rem/1.2 var(--font-mono);color:var(--muted);padding:8px 4px 0;display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center}
.legend i,.sta::before{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;background:var(--line-2)}
.legend i.ouro{background:var(--gold)}.legend i.prata{background:var(--silver)}.legend i.bronze{background:var(--bronze)}.legend i.falha{background:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.situ{background:var(--t);border-radius:var(--r-sm);padding:12px 14px;border-left:4px solid var(--c)}
.situ-k,.feitas-k{display:block;font:700 .7rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:6px}.situ p{font-size:.93rem;color:var(--ink)}
.feitas{margin-top:12px;padding:0 4px}.feitas-k{color:var(--muted)}
.feitas ol{margin:0;padding-left:1.5em;color:var(--ink-2);font-size:.88rem}.feitas li{margin-bottom:3px;overflow-wrap:anywhere}
.q{font-size:1.45rem;margin-block:20px 14px}.q u{text-decoration:none;box-shadow:inset 0 -.38em 0 rgba(243,149,63,.45)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line-2);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--brand);background:#f7f8fe}
.op-l{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface-2);color:var(--brand);font:800 .9rem var(--font-display)}
.op-l svg{width:18px;height:18px}.op-t{overflow-wrap:anywhere;font-size:.97rem}
.op-tag{font:700 .68rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.opt.sel{border-color:var(--brand);background:#eef1fc;box-shadow:0 0 0 3px rgba(41,55,127,.14)}.opt.sel .op-l{background:var(--brand);color:#fff}
.opt.out{background:#faf3f2;border-color:#ecc6c2;color:#7b625f}.opt.out .op-t{text-decoration:line-through;text-decoration-color:#c9908a}.opt.out .op-l{background:var(--bad-bg);color:var(--bad)}.opt.out .op-tag{background:var(--bad-bg);color:var(--bad)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}.opt.right .op-l{background:var(--ok);color:#fff}.opt.right .op-tag{background:var(--ok);color:#fff}
.opt:disabled{cursor:default}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;margin-top:18px}
.pips{display:flex;align-items:center;gap:7px;font-size:.84rem;color:var(--muted);font-weight:600}.pips i{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--accent)}.pips i.used{background:#fff;border-color:var(--line-2)}
.qact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#fbw{outline:none;margin-top:6px}
.fb{margin-top:16px;border-radius:var(--r);padding:16px 18px;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:#9fd2b6}.fb.bad{background:var(--bad-bg);border-color:#efb7b2}
.fb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.05rem}.fb-h svg{width:24px;height:24px;flex:none}.fb.ok .fb-h{color:var(--ok)}.fb.bad .fb-h{color:var(--bad)}
.fb-pts{margin-left:auto;font:800 .95rem var(--font-mono);background:#fff;border-radius:999px;padding:4px 12px}
.fb-p{margin-top:8px;font-size:.93rem}.fb-certo{margin-top:6px;background:#fff;border:2px solid var(--ok);border-radius:10px;padding:10px 12px;font-weight:600}
.why{margin-top:10px;display:grid;gap:8px;font-size:.92rem;color:var(--ink)}.why b{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.why-a{font-weight:600}.why-n{background:rgba(255,255,255,.7);border-radius:8px;padding:8px 10px}
.why-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.82rem}

/* conclusão */
.done-card{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}
.done-h{display:grid;gap:8px;justify-items:start}.done-h h2{font-size:1.7rem}
.score-big{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-block:22px 12px}
.sb-n{font:800 3.6rem/1 var(--font-display);color:var(--brand)}.sb-d{display:block;color:var(--muted);font-size:.9rem}
.sb-p{font:800 2rem/1 var(--font-display);color:var(--c);text-align:right}.sb-p small{font:500 .78rem var(--font-body)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0 0}
.sta{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}.sta dt{font-size:.78rem;color:var(--ink-2);font-weight:600}.sta dd{margin:2px 0 0;font:800 1.7rem var(--font-display)}
.sta.ouro::before{background:var(--gold)}.sta.prata::before{background:var(--silver)}.sta.bronze::before{background:var(--bronze)}.sta.falha::before{background:var(--bad)}
.sta{display:block}.sta::before{margin-bottom:6px;display:block;width:22px;height:6px;border-radius:4px}
.done-act,.final-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* final / painéis / tabelas */
.final-hero{background:var(--brand);color:#fff;border-radius:var(--r);padding:26px;background-image:linear-gradient(120deg,rgba(255,255,255,.0) 55%,rgba(243,149,63,.28));overflow:hidden}
.final-hero .eyebrow{color:#c9d0f2}.final-hero h2{font-size:2rem;margin-block:8px 18px;overflow-wrap:anywhere}

</script>
<script>
'use strict';
/* ===== NÚCLEO: regras, pontuação, tentativas, ranking, CSV e armazenamento ===== */

const CONFIG = {
  MAX_TENT: 3,
  PONTOS: [100, 70, 40],
  NOME_MIN: 2,
  NOME_MAX: 60,
  N_DISTRATORES: 3,
  /* Procedimentos sem CRM no material (Pix Automático, Suspeita de Fraude, Exclusão SPC,
     Ligação de Cobrança). Troque para false para ficar só com Adapter, NG e Simetra. */
  INCLUIR_GERAL: true,
  PREFIXO: 'dfx.v1.'
};

const CRMS_TODOS = [
  { key: 'Adapter', label: 'Adapter', sigla: 'AD' },
  { key: 'NG', label: 'NG', sigla: 'NG' },
  { key: 'Simetra', label: 'Simetra', sigla: 'SM' },
  { key: 'Geral', label: 'Geral (sem CRM)', sigla: 'GE' }
];
const CRMS = CRMS_TODOS.filter(c => c.key !== 'Geral' || CONFIG.INCLUIR_GERAL);
const CRM_BY_KEY = Object.fromEntries(CRMS_TODOS.map(c => [c.key, c]));

/* ---- fluxos normalizados ---- */
const FLOWS = FLOWS_RAW
  .filter(f => CRMS.some(c => c.key === f.crm))
  .map(f => {
    const p = PROCS[f.proc];
    const steps = f.steps.map(s => ({ t: s[0], n: s[1] || '' }));
    return {
      id: f.id, proc: f.proc, crm: f.crm, titulo: p.nome, sub: f.sub, ctx: f.ctx,
      fonte: 'B2B - ' + p.nome + ' · atualizado em ' + p.upd,
      steps, n: steps.length, max: steps.length * CONFIG.PONTOS[0],
      comum: f.comum || [], validar: f.validar || ''
    };
  });
const FLOW_BY_ID = Object.fromEntries(FLOWS.map(f => [f.id, f]));

/* ---- utilidades ---- */
function norm(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function limparNome(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function validarNome(s) {
  const n = limparNome(s);
  if (!n) return { ok: false, msg: 'Informe seu nome para iniciar o desafio.' };
  if (n.length < CONFIG.NOME_MIN) return { ok: false, msg: 'O nome precisa ter pelo menos ' + CONFIG.NOME_MIN + ' caracteres.' };
  if (n.length > CONFIG.NOME_MAX) return { ok: false, msg: 'O nome pode ter no máximo ' + CONFIG.NOME_MAX + ' caracteres.' };
  return { ok: true, nome: n };
}
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
function palavras(s) { return new Set(norm(s).split(/[^a-z0-9]+/).filter(w => w.length > 2)); }
function similaridade(a, b) {
  const A = palavras(a), B = palavras(b);
  if (!A.size || !B.size) return 0;
  let inter = 0; A.forEach(w => { if (B.has(w)) inter++; });
  return inter / (A.size + B.size - inter);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---- opções de resposta (determinísticas por participação, fluxo e etapa) ----
   Distratores: apenas etapas documentadas do MESMO CRM (a maioria do próprio fluxo).
   A ordem e as opções são sempre as mesmas para a mesma decisão. */
const _cacheOpc = {};
function opcoes(seed, flow, i) {
  const ck = seed + '|' + flow.id + '|' + i;
  if (_cacheOpc[ck]) return _cacheOpc[ck];
  const certo = flow.steps[i].t;
  const rnd = mulberry32(hashStr(ck));
  const textosFluxo = new Set(flow.steps.map(s => s.t));
  const ok = t => t !== certo && similaridade(t, certo) < 0.6;
  const mesmos = []; const vistos = new Set();
  flow.steps.forEach((s, j) => { if (j !== i && ok(s.t) && !vistos.has(s.t)) { vistos.add(s.t); mesmos.push(s.t); } });
  const outros = [];
  FLOWS.forEach(f => {
    if (f.crm !== flow.crm || f.id === flow.id) return;
    f.steps.forEach(s => { if (!textosFluxo.has(s.t) && ok(s.t) && !vistos.has(s.t)) { vistos.add(s.t); outros.push(s.t); } });
  });
  const A = shuffle(mesmos, rnd), B = shuffle(outros, rnd);
  const alvo = CONFIG.N_DISTRATORES;
  const dist = [];
  A.slice(0, alvo - 1).forEach(t => dist.push(t));
  B.slice(0, alvo - dist.length).forEach(t => dist.push(t));
  if (dist.length < alvo) A.slice(alvo - 1).forEach(t => { if (dist.length < alvo) dist.push(t); });
  if (dist.length < alvo) B.slice(alvo - dist.length).forEach(t => { if (dist.length < alvo) dist.push(t); });
  const todas = shuffle([{ t: certo, correct: true }].concat(dist.map(t => ({ t, correct: false }))), rnd);
  const res = todas.map(o => ({ k: 'o' + hashStr(o.t).toString(36), t: o.t, correct: o.correct }));
  _cacheOpc[ck] = res;
  return res;

/* Registra uma resposta. Cada resposta incorreta consome uma tentativa da decisão atual. */
function responder(sess, flowId, key) {

  const d = fs.dec[fs.idx];
  if (d.res !== null) return { erro: 'ja_resolvida' };

function ordenarRanking(regs) {

async function hashPin(pin, sal) {

/* ---------- 2. seleção de fluxos ---------- */
function statusInfo(f) {
  const st = statusFluxo(sess, f);
  const fs = sess.fluxos[f.id];
  if (st === 'concluido') { const c = contagemFluxo(sess, f); return { st, rot: 'Concluído', det: c.pts + '/' + c.max + ' pts', btn: 'Ver resultado' }; }
  if (st === 'em_andamento') { const feitas = fs.dec.filter(d => d.res !== null).length; return { st, rot: 'Em andamento', det: feitas + '/' + f.n + ' etapas', btn: 'Continuar' }; }
  return { st, rot: 'Não iniciado', det: '', btn: 'Iniciar' };
}
function viewSelect() {
  const concl = fluxosConcluidos(sess).length, total = FLOWS.length;
  const tabs = CRMS.map(c => {
    const fl = FLOWS.filter(f => f.crm === c.key);
    const ok = fl.filter(f => statusFluxo(sess, f) === 'concluido').length;
    return '<button role="tab" class="tab crm-' + c.key.toLowerCase() + (ui.crmTab === c.key ? ' on' : '') + '" aria-selected="' + (ui.crmTab === c.key) + '" data-act="tab" data-v="' + c.key + '"><b>' + c.sigla + '</b><span class="tab-l">' + esc(c.label) + '</span><span class="tab-n">' + ok + '/' + fl.length + '</span></button>';
  }).join('');
  const lista = FLOWS.filter(f => f.crm === ui.crmTab).map(f => {
    const s = statusInfo(f);
    return '<article class="fcard st-' + s.st + ' crm-' + f.crm.toLowerCase() + '"><div class="fc-top">' + crmBadge(f.crm) + '<span class="status s-' + s.st + '">' + (s.st === 'concluido' ? ic.ok : '') + s.rot + (s.det ? ' · ' + s.det : '') + '</span></div>'
      + '<h3>' + esc(f.titulo) + '</h3><p class="fc-sub">' + esc(f.sub) + '</p><p class="fc-meta">' + f.n + ' etapas · até ' + f.max + ' pts</p>'
      + '<button class="btn ' + (s.st === 'concluido' ? 'ghost' : 'primary') + '" data-act="abrir" data-id="' + f.id + '">' + s.btn + ic.arrow + '</button></article>';
  }).join('');
  const feitas = Object.keys(sess.fluxos).reduce((a, id) => a + sess.fluxos[id].dec.filter(d => d.res !== null).length, 0);
  const totalDec = FLOWS.reduce((a, f) => a + f.n, 0);
  return topbar() + avisoStorage() + '<main class="wrap select">'
    + '<section class="overview"><div class="ov-main"><p class="eyebrow">Escolha um fluxo</p><h2>Olá, ' + esc(sess.nome) + '</h2><p class="ov-sub">Cada fluxo é uma sequência de etapas de um procedimento. Você pode jogar na ordem que preferir.</p></div>'
    + '<div class="ov-prog"><div class="ov-row"><span>Progresso geral</span><b>' + concl + ' de ' + total + ' fluxos concluídos</b></div>' + bar(total ? concl / total * 100 : 0, 'Progresso geral do treinamento', 'navy')
    + '<div class="ov-row sm"><span>' + feitas + ' de ' + totalDec + ' etapas respondidas</span><b>' + pontosAoVivo(sess) + ' pts</b></div></div></section>'
    + '<div class="tabs" role="tablist" aria-label="CRM">' + tabs + '</div>'
    + '<section class="cards" role="tabpanel">' + lista + '</section>'
    + '<div class="end-bar"><div><b>Terminou por hoje?</b><span>O resultado considera somente os fluxos concluídos e entra no ranking.</span></div><div class="end-act"><button class="btn ghost" data-act="ranking">' + ic.trophy + 'Classificação</button><button class="btn primary" data-act="encerrar">Encerrar participação</button></div></div>'
    + '</main>' + rodape();
}

/* ---------- 3. desafio (uma decisão por vez) ---------- */
function viewPlay() {
  const flow = FLOW_BY_ID[sess.atual]; const fs = estadoFluxo(sess, flow);
  const i = fs.idx; const d = fs.dec[i]; const step = flow.steps[i];
  const opts = opcoes(sess.seed, flow, i);
  const res = d.res !== null;
  const feitasN = fs.dec.filter(x => x.res !== null).length;
  const concl = fluxosConcluidos(sess).length;
  const restantes = Math.max(0, CONFIG.MAX_TENT - d.tent);

  const trilha = flow.steps.map((s, j) => {
    const dj = fs.dec[j]; let cls = 'fut', txt = String(j + 1), lab = 'Etapa ' + (j + 1) + ', pendente';
    if (dj.res !== null) { cls = dj.res === 1 ? 'ouro' : dj.res === 2 ? 'prata' : dj.res === 3 ? 'bronze' : 'falha'; txt = dj.res === 0 ? '×' : String(j + 1); lab = 'Etapa ' + (j + 1) + ', ' + dj.pts + ' pontos'; }
    if (j === i && dj.res === null) { cls = 'atual'; lab = 'Etapa ' + (j + 1) + ', atual'; }
    return '<li class="nd ' + cls + '" ' + (j === i ? 'aria-current="step"' : '') + ' aria-label="' + lab + '"><span>' + txt + '</span></li>';
  }).join('');

  const feitasLista = flow.steps.slice(0, i).map((s, j) => '<li>' + esc(s.t) + '</li>');
  const mostrar = ui.verTodasFeitas ? feitasLista : feitasLista.slice(-3);
  const ocultas = feitasLista.length - mostrar.length;
  const contexto = '<div class="situ"><span class="situ-k">Situação</span><p>' + esc(flow.ctx) + '</p></div>'
    + (i > 0 ? '<div class="feitas"><p class="feitas-k">Etapas já realizadas' + (ocultas > 0 ? ' <button class="link" data-act="vertodas">mostrar todas (' + feitasLista.length + ')</button>' : (ui.verTodasFeitas && feitasLista.length > 3 ? ' <button class="link" data-act="vertodas">mostrar menos</button>' : '')) + '</p><ol start="' + (i - mostrar.length + 1) + '">' + mostrar.join('') + '</ol></div>' : '');

  const opHtml = opts.map((o, k) => {
    const out = d.erradas.indexOf(o.k) >= 0; const sel = ui.sel === o.k && !res && !out;
    const certa = res && o.correct && (d.res > 0 || true);
    let cls = 'opt'; if (out) cls += ' out'; if (sel) cls += ' sel'; if (certa) cls += ' right';
    const dis = res || out;
    return '<button class="' + cls + '" role="radio" aria-checked="' + sel + '" data-act="opt" data-k="' + o.k + '" ' + (dis ? 'disabled' : '') + '><span class="op-l">' + (certa ? ic.ok : out ? ic.no : LETRAS[k]) + '</span><span class="op-t">' + esc(o.t) + '</span>' + (out ? '<span class="op-tag">Descartada</span>' : certa ? '<span class="op-tag">' + (d.res === 0 ? 'Etapa correta' : 'Correta') + '</span>' : '') + '</button>';
  }).join('');

  const pips = '<div class="pips" aria-label="Tentativas restantes: ' + restantes + ' de ' + CONFIG.MAX_TENT + '"><span>Tentativas</span>' + Array.from({ length: CONFIG.MAX_TENT }, (_, k) => '<i class="' + (k < d.tent ? 'used' : '') + '"></i>').join('') + '</div>';

  let fb = '';
  if (res && d.res > 0) {
    fb = '<div class="fb ok" role="status"><div class="fb-h">' + ic.ok + '<b>Correto!</b><span class="fb-pts">+' + d.pts + ' pontos</span></div>' + explicacao(flow, step, d.res === 1 ? 'Acertou de primeira.' : 'Acertou na ' + d.res + 'ª tentativa.') + '</div>';
  } else if (res) {
    fb = '<div class="fb bad" role="status"><div class="fb-h">' + ic.no + '<b>Tentativas esgotadas</b><span class="fb-pts">0 pontos</span></div><p class="fb-p">A sequência esperada neste ponto do procedimento era:</p><p class="fb-certo">' + esc(step.t) + '</p>' + explicacao(flow, step, '') + '</div>';
  } else if (ui.fb && ui.fb.tipo === 'errada') {
    fb = '<div class="fb bad" role="status"><div class="fb-h">' + ic.no + '<b>Não é a próxima etapa</b></div><p class="fb-p">Essa resposta não corresponde à sequência esperada para ' + esc(flow.titulo) + ' no ' + esc(CRM_BY_KEY[flow.crm].label) + '. Você ainda tem <b>' + restantes + '</b> tentativa' + (restantes === 1 ? '' : 's') + ' nesta etapa.</p></div>';
  } else if (d.tent > 0) {
    fb = '<p class="hint">Você já usou ' + d.tent + ' tentativa' + (d.tent === 1 ? '' : 's') + ' nesta etapa. Restam ' + restantes + '.</p>';
  }

  const acao = res
    ? '<button class="btn accent lg" data-act="proxima">' + (i === flow.n - 1 ? 'Concluir fluxo' : 'Próxima etapa') + ic.arrow + '</button>'
    : '<button class="btn primary lg" data-act="confirmar" ' + (ui.sel ? '' : 'disabled') + '>Confirmar resposta</button>' + (ui.sel ? '' : '<span class="hint inline">Selecione uma opção para continuar.</span>');

  return topbar('<button class="btn sm ghost-d" data-act="pausar">' + ic.pause + 'Pausar</button>') + '<main class="wrap play crm-' + flow.crm.toLowerCase() + '">'
    + '<section class="play-head"><div class="ph-l">' + crmBadge(flow.crm, true) + '<div><h2>' + esc(flow.titulo) + '</h2><p>' + esc(flow.sub) + '</p></div></div>'
    + '<div class="ph-prog"><div class="pg"><div class="pg-row"><span>Etapa <b>' + (i + 1) + '</b> de <b>' + flow.n + '</b></span><span>' + feitasN + ' concluída' + (feitasN === 1 ? '' : 's') + '</span></div>' + bar(feitasN / flow.n * 100, 'Progresso do fluxo atual', 'crmc') + '</div>'
    + '<div class="pg"><div class="pg-row"><span>Treinamento: <b>' + concl + '</b> de <b>' + FLOWS.length + '</b> fluxos</span><span><b>' + pontosAoVivo(sess) + '</b> pts</span></div>' + bar(concl / FLOWS.length * 100, 'Progresso geral do treinamento', 'navy') + '</div></div></section>'
    + '<div class="play-grid"><aside class="rail" aria-label="Trilha do fluxo"><ol class="trail">' + trilha + '</ol><p class="legend"><i class="ouro"></i>100 <i class="prata"></i>70 <i class="bronze"></i>40 <i class="falha"></i>0</p></aside>'
    + '<section class="qcard" aria-labelledby="q-t">' + contexto
    + '<h3 id="q-t" class="q">' + (i === 0 ? 'Qual é a <u>primeira</u> etapa deste procedimento?' : 'Qual é a <u>próxima</u> etapa deste procedimento?') + '</h3>'
    + '<div class="opts" role="radiogroup" aria-labelledby="q-t">' + opHtml + '</div>'
    + '<div class="qfoot">' + pips + '<div class="qact">' + acao + '</div></div>'
    + '<div id="fbw" tabindex="-1">' + fb + '</div></section></div></main>';
}
function explicacao(flow, step, abre) {
  return '<div class="why">' + (abre ? '<p class="why-a">' + abre + '</p>' : '') + '<p class="why-s"><b>Etapa correta</b> ' + esc(step.t) + '</p>'
    + (step.n ? '<p class="why-n"><b>No material</b> ' + esc(step.n) + '</p>' : '')
    + (flow.validar ? '<p class="why-n"><b>Observação</b> ' + esc(flow.validar) + '</p>' : '')
    + '<p class="why-f">' + crmBadge(flow.crm) + '<span>' + esc(flow.fonte) + '</span></p></div>';
}

/* ---------- 4. conclusão do fluxo ---------- */
function viewFlowDone() {
  const flow = FLOW_BY_ID[sess.atual]; const c = contagemFluxo(sess, flow);
  const todos = fluxosConcluidos(sess).length === FLOWS.length;
  const proximo = FLOWS.find(f => f.crm === flow.crm && statusFluxo(sess, f) !== 'concluido') || FLOWS.find(f => statusFluxo(sess, f) !== 'concluido');
  return topbar() + '<main class="wrap done crm-' + flow.crm.toLowerCase() + '"><section class="done-card"><div class="done-h">' + crmBadge(flow.crm, true) + '<p class="eyebrow">Fluxo concluído</p><h2>' + esc(flow.titulo) + '</h2><p class="muted">' + esc(flow.sub) + '</p></div>'
    + '<div class="score-big"><div><span class="sb-n">' + c.pts + '</span><span class="sb-d">de ' + c.max + ' pontos</span></div><div class="sb-p">' + fmtPct(c.pct) + '<small>de aproveitamento</small></div></div>' + bar(c.pct, 'Aproveitamento do fluxo', 'crmc')
    + '<dl class="stats"><div class="sta ouro"><dt>1ª tentativa</dt><dd>' + c.t1 + '</dd></div><div class="sta prata"><dt>2ª tentativa</dt><dd>' + c.t2 + '</dd></div><div class="sta bronze"><dt>3ª tentativa</dt><dd>' + c.t3 + '</dd></div><div class="sta falha"><dt>Sem acerto</dt><dd>' + c.falhas + '</dd></div></dl>'
    + '<div class="done-act">' + (todos ? '<button class="btn accent lg" data-act="final">Ver resultado final' + ic.arrow + '</button>' : (proximo ? '<button class="btn accent lg" data-act="outro" data-id="' + proximo.id + '">Jogar outro fluxo' + ic.arrow + '</button>' : '')) + '<button class="btn ghost lg" data-act="fluxos">Voltar aos fluxos</button></div></section></main>' + rodape();
}

/* ---------- 5. resultado final ---------- */
function mensagemFinal(pct) {
  if (pct >= 90) return 'Excelente! Você demonstrou domínio dos procedimentos. Continue compartilhando esse conhecimento com o time.';
  if (pct >= 70) return 'Muito bom! Você está no caminho certo. Revisar as etapas em que errou deixa a operação ainda mais segura.';
  if (pct >= 50) return 'Bom começo! Cada tentativa fortalece a memória operacional. Jogue de novo os fluxos mais difíceis para evoluir.';
  return 'Aprender faz parte do processo. Reveja os procedimentos no portal e volte para novas rodadas: a evolução vem com a prática.';
}
function viewFinal() {
  const reg = ui.regFinal || (ui.regFinal = (lerResultados().find(r => r.id === sess.registroId) || montarRegistro(sess)));
  const pos = posicaoDe(lerResultados(), reg.id);
  const crmRows = CRMS.map(c => { const x = reg.porCrm[c.key] || { fluxos: 0, pts: 0, max: 0, pct: 0 }; return '<tr><td>' + crmBadge(c.key) + '</td><td class="num">' + x.fluxos + '</td><td class="num">' + x.pts + ' / ' + x.max + '</td><td class="barc">' + (x.max ? bar(x.pct, 'Aproveitamento ' + c.label, 'crm-' + c.key.toLowerCase()) : '') + '</td><td class="num">' + (x.max ? fmtPct(x.pct) : '—') + '</td></tr>'; }).join('');
  const fluxRows = reg.porFluxo.map(f => '<tr><td>' + crmBadge(f.crm) + '</td><td>' + esc(f.titulo) + '<small>' + esc(f.sub) + '</small></td><td class="num">' + f.pts + ' / ' + f.max + '</td><td class="num">' + fmtPct(f.pct) + '</td><td class="num">' + f.t1 + ' · ' + f.t2 + ' · ' + f.t3 + ' · ' + f.falhas + '</td></tr>').join('');
  const dist = [['1ª tentativa', reg.t1, 'ouro'], ['2ª tentativa', reg.t2, 'prata'], ['3ª tentativa', reg.t3, 'bronze'], ['Sem acerto', reg.falhas, 'falha']].map(x => '<div class="dist-r"><span>' + x[0] + '</span><div class="dist-b"><i class="' + x[2] + '" style="width:' + (reg.decisoes ? x[1] / reg.decisoes * 100 : 0) + '%"></i></div><b>' + x[1] + '</b></div>').join('');
  return topbar() + '<main class="wrap final"><section class="final-hero"><p class="eyebrow">Resultado da participação</p><h2>' + esc(reg.nome) + '</h2>'
    + '<div class="fh-grid"><div class="kpi big"><span class="k-l">Pontuação total</span><span class="k-v">' + reg.total + '</span><span class="k-s">de ' + reg.max + ' possíveis</span></div>'
    + '<div class="kpi"><span class="k-l">Aproveitamento</span><span class="k-v">' + fmtPct(reg.pct) + '</span><span class="k-s">dos fluxos concluídos</span></div>'
    + '<div class="kpi"><span class="k-l">Fluxos concluídos</span><span class="k-v">' + reg.fluxos + '</span><span class="k-s">de ' + reg.totalFluxos + ' disponíveis</span></div>'
    + '<div class="kpi rank"><span class="k-l">Posição no ranking</span><span class="k-v">' + (pos ? pos.pos + 'º' : '—') + '</span><span class="k-s">' + (pos ? 'de ' + pos.de + ' participaç' + (pos.de === 1 ? 'ão' : 'ões') : '') + '</span></div></div>'
    + '<p class="msg">' + mensagemFinal(reg.pct) + '</p>'
    + (reg.fluxos < reg.totalFluxos ? '<p class="alert info">' + ic.info + '<span>Você encerrou com ' + reg.fluxos + ' de ' + reg.totalFluxos + ' fluxos. O aproveitamento considera apenas os fluxos concluídos.</span></p>' : '') + '</section>'
    + '<section class="panel"><h3>Desempenho por CRM</h3><div class="tw"><table class="tbl"><thead><tr><th>CRM</th><th class="num">Fluxos</th><th class="num">Pontos</th><th></th><th class="num">Aprov.</th></tr></thead><tbody>' + crmRows + '</tbody></table></div></section>'
    + '<section class="panel"><h3>Distribuição dos acertos</h3><p class="muted">' + reg.decisoes + ' decisões respondidas · ' + reg.tentativas + ' tentativas utilizadas</p><div class="dist">' + dist + '</div></section>'
    + '<section class="panel"><h3>Desempenho por fluxo</h3><div class="tw"><table class="tbl"><thead><tr><th>CRM</th><th>Fluxo</th><th class="num">Pontos</th><th class="num">Aprov.</th><th class="num" title="1ª · 2ª · 3ª tentativa · sem acerto">1ª · 2ª · 3ª · ✗</th></tr></thead><tbody>' + fluxRows + '</tbody></table></div></section>'
    + '<div class="final-act"><button class="btn accent lg" data-act="ranking">' + ic.trophy + 'Ver classificação geral</button><button class="btn ghost lg" data-act="nova">Nova participação</button></div></main>' + rodape();
}

/* ---------- 6. ranking (participantes) ---------- */
function viewRanking() {
  const lista = ordenarRanking(lerResultados());
  const meu = sess && sess.registroId;
  const linhas = lista.map(e => '<tr class="' + (meu && e.reg.id === meu ? 'me' : '') + '"><td class="pos">' + (e.pos <= 3 ? '<span class="medal m' + e.pos + '">' + e.pos + '</span>' : e.pos + 'º') + '</td><td>' + esc(e.reg.nome) + (meu && e.reg.id === meu ? ' <span class="voce">você</span>' : '') + '</td><td class="num"><b>' + e.reg.total + '</b></td><td class="num">' + fmtPct(e.reg.pct) + '</td><td class="num">' + e.reg.fluxos + '</td><td class="num dt">' + fmtData(e.reg.data) + '</td></tr>').join('');
  return topbar() + '<main class="wrap rank"><div class="rank-h"><div><p class="eyebrow">Classificação geral</p><h2>Ranking deste dispositivo</h2><p class="muted">Ordenado pela maior pontuação. Empates: maior aproveitamento e, depois, menos tentativas incorretas.</p></div><button class="btn ghost" data-act="sair-rank">' + ic.back + 'Voltar</button></div>'
    + (lista.length ? '<div class="tw panel"><table class="tbl rk"><thead><tr><th>Pos.</th><th>Colaborador</th><th class="num">Pontuação</th><th class="num">Aprov.</th><th class="num">Fluxos</th><th class="num">Data e horário</th></tr></thead><tbody>' + linhas + '</tbody></table></div>' : '<div class="empty panel">' + ic.trophy + '<h3>Nenhuma participação concluída ainda</h3><p>O ranking é atualizado automaticamente quando alguém encerra uma participação neste navegador.</p></div>')
    + '</main>' + rodape();
}

/* ---------- 7. área administrativa ---------- */
function viewAdmin() {
  if (!ui.adminOk) {
    const novo = !temPin();
    return topbarAdmin() + '<main class="wrap adm-gate"><section class="gate"><span class="gate-i">' + ic.lock + '</span><h2>' + (novo ? 'Defina um PIN administrativo' : 'Acesso administrativo') + '</h2>'
      + '<p class="muted">' + (novo ? 'Este PIN protege a área de resultados neste navegador. Escolha 4 a 12 caracteres.' : 'Informe o PIN para consultar resultados, exportar CSV e limpar o ranking.') + '</p>'
      + '<form id="f-pin" novalidate><label for="pin">' + (novo ? 'Novo PIN' : 'PIN') + '</label><input id="pin" name="pin" type="password" autocomplete="off" maxlength="12" inputmode="text">'
      + (novo ? '<label for="pin2">Confirme o PIN</label><input id="pin2" name="pin2" type="password" autocomplete="off" maxlength="12">' : '')
      + '<p class="erro" role="alert">' + esc(ui.pinErro) + '</p><button class="btn primary lg" type="submit">' + (novo ? 'Definir PIN e entrar' : 'Entrar') + '</button></form>'
      + '<p class="alert warn">' + ic.info + '<span><b>Limite de segurança:</b> o PIN fica guardado (com hash) no próprio navegador. Ele impede acesso casual, mas não é proteção real: quem controla o navegador pode apagar os dados do site e redefinir o PIN.</span></p></section></main>';
  }
  const tabs = [['resultados', 'Resultados'], ['ranking', 'Classificação'], ['consolidado', 'Consolidado'], ['fluxos', 'Fluxos cadastrados'], ['dados', 'Dados e segurança']]
    .map(t => '<button role="tab" class="tab2' + (ui.adminTab === t[0] ? ' on' : '') + '" aria-selected="' + (ui.adminTab === t[0]) + '" data-act="atab" data-v="' + t[0] + '">' + t[1] + '</button>').join('');
  const regs = lerResultados();
  let corpo = '';
  if (ui.adminTab === 'resultados') corpo = admResultados(regs);
  else if (ui.adminTab === 'ranking') corpo = admRanking(regs);
  else if (ui.adminTab === 'consolidado') corpo = admConsolidado(regs);
  else if (ui.adminTab === 'fluxos') corpo = admFluxos();
  else corpo = admDados(regs);
  return topbarAdmin() + '<main class="wrap adm"><div class="adm-h"><h2>Painel de resultados</h2><span class="muted">' + regs.length + ' participaç' + (regs.length === 1 ? 'ão' : 'ões') + ' registrada' + (regs.length === 1 ? '' : 's') + ' neste dispositivo</span></div><div class="tabs2" role="tablist">' + tabs + '</div>' + corpo + '</main>';
}
function admFiltrar(regs) {
  const a = ui.adm; const q = norm(a.busca);
  let l = regs.filter(r => !q || norm(r.nome).indexOf(q) >= 0);
  if (a.crm) l = l.filter(r => r.porCrm[a.crm] && r.porCrm[a.crm].fluxos > 0);
  const sinal = a.dir === 'asc' ? 1 : -1;
  const val = r => a.crm ? (r.porCrm[a.crm] || { pts: 0 }).pts : r.total;
  l.sort((x, y) => {
    if (a.ordem === 'nome') return sinal * norm(x.nome).localeCompare(norm(y.nome));
    if (a.ordem === 'pontos') return sinal * (val(x) - val(y));
    return sinal * (new Date(x.data) - new Date(y.data));
  });
  return l;
}
function th(rot, chave) {
  const a = ui.adm; const on = a.ordem === chave;
  return '<th class="num sortable" aria-sort="' + (on ? (a.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '"><button class="sortb' + (on ? ' on' : '') + '" data-act="ordenar" data-v="' + chave + '">' + rot + (on ? (a.dir === 'asc' ? ' ▲' : ' ▼') : '') + '</button></th>';
}
function admResultados(regs) {
  const a = ui.adm; const l = admFiltrar(regs);
  const opCrm = '<option value="">Todos os CRMs</option>' + CRMS.map(c => '<option value="' + c.key + '"' + (a.crm === c.key ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('');
  const linhas = l.map(r => {

    const v = validarNome(document.getElementById('nome').value);

    ui.erroNome = ''; sess = novaSessao(v.nome); ui.regFinal = null; salvar(); ui.crmTab = CRMS[0].key; ir('select');
  } else if (f.id === 'f-pin') {
    const pin = document.getElementById('pin').value; const novo = !temPin();
    if (novo) {
      const p2 = document.getElementById('pin2').value;
      if (pin.length < 4 || pin.length > 12) { ui.pinErro = 'O PIN precisa ter de 4 a 12 caracteres.'; render(); return; }
      if (pin !== p2) { ui.pinErro = 'Os dois PINs não são iguais.'; render(); return; }
      await definirPin(pin); ui.adminOk = true; ui.pinErro = ''; render();
    } else if (await conferirPin(pin)) { ui.adminOk = true; ui.pinErro = ''; render(); }
    else { ui.pinErro = 'PIN incorreto.'; render(); const p = document.getElementById('pin'); if (p) p.focus(); }
  } else if (f.id === 'f-pin2') {
    const a = document.getElementById('pin-a').value, n = document.getElementById('pin-n').value;
    if (!(await conferirPin(a))) { ui.modal.erro = 'O PIN atual está incorreto.'; render(); return; }
    if (n.length < 4 || n.length > 12) { ui.modal.erro = 'O novo PIN precisa ter de 4 a 12 caracteres.'; render(); return; }
    await definirPin(n); ui.modal = null; render(); aviso('PIN alterado.');
  }
});

render();
